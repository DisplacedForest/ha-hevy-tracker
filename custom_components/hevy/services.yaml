get_workout_history:
  name: Get workout history
  description: Returns workout history for a specified number of days with full exercise and set detail.
  fields:
    days:
      name: Days
      description: Number of days of history to return
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 90
          mode: box
    config_entry_id:
      name: Config entry ID
      description: The Hevy integration config entry ID
      required: true
      selector:
        config_entry:
          integration: hevy

get_exercise_catalog:
  name: Get exercise catalog
  description: Returns the cached Hevy exercise catalog so you can look up the exact names log_workout accepts.
  fields:
    config_entry_id:
      name: Config entry ID
      description: The Hevy integration config entry ID
      required: true
      selector:
        config_entry:
          integration: hevy

get_routines:
  name: Get routines
  description: Returns your saved Hevy routines with full set detail, in the unit system configured for the integration. The sets can be passed straight to log_workout.
  fields:
    config_entry_id:
      name: Config entry ID
      description: The Hevy integration config entry ID
      required: true
      selector:
        config_entry:
          integration: hevy

log_workout:
  name: Log workout
  description: Posts a completed workout to Hevy with full exercise and set detail. Mistaken logs can only be deleted in the Hevy mobile app.
  fields:
    config_entry_id:
      name: Config entry ID
      description: The Hevy integration config entry ID
      required: true
      selector:
        config_entry:
          integration: hevy
    title:
      name: Title
      description: Name of the workout
      required: true
      selector:
        text:
    exercises:
      name: Exercises
      description: >-
        List of exercises. Each needs a name matching a Hevy exercise template
        and at least one set. A set takes an optional type (warmup, normal,
        failure, dropset), weight, reps, duration_seconds, distance, and rpe.
        Weight and distance use the unit system configured for the integration.
      required: true
      selector:
        object:
    start_time:
      name: Start time
      description: When the workout started. Defaults to the end time minus the duration.
      required: false
      selector:
        datetime:
    end_time:
      name: End time
      description: When the workout ended. Defaults to now.
      required: false
      selector:
        datetime:
    duration_minutes:
      name: Duration
      description: Workout length in minutes, used to derive the start time
      required: false
      selector:
        number:
          min: 1
          max: 600
          mode: box
    description:
      name: Description
      description: Optional workout notes
      required: false
      selector:
        text:
    is_private:
      name: Private
      description: Hide the workout from your Hevy followers
      required: false
      default: false
      selector:
        boolean:

get_workout_board:
  name: Get workout board
  description: Returns loaded accounts, routines, exercises, units, and the saved
    workout.
  fields:
    config_entry_id:
      name: Hevy account
      required: false
      selector:
        config_entry:
          integration: hevy
start_workout:
  name: Start workout
  description: Saves a new workout draft. Existing drafts must be resumed or cleared
    first.
  fields:
    config_entry_id:
      name: Hevy account
      required: true
      selector:
        config_entry:
          integration: hevy
    routine_id:
      name: Routine ID
      selector:
        text: null
    title:
      name: Title
      selector:
        text: null
update_workout:
  name: Update workout
  description: Saves the full workout draft. Stale revisions are rejected to protect
    changes from other devices.
  fields:
    config_entry_id:
      name: Hevy account
      required: true
      selector:
        config_entry:
          integration: hevy
    session_id:
      name: Session ID
      required: true
      selector:
        text: null
    revision:
      name: Revision
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    title:
      name: Title
      required: true
      selector:
        text: null
    is_private:
      name: Private workout
      required: true
      selector:
        boolean: null
    exercises:
      name: Exercises
      required: true
      selector:
        object: null
finish_workout:
  name: Finish workout
  description: Sends only checked sets to Hevy. Confirm with the person logging before
    calling. An uncertain submission must be checked in Hevy before any retry.
  fields:
    config_entry_id:
      name: Hevy account
      required: true
      selector:
        config_entry:
          integration: hevy
    session_id:
      name: Session ID
      required: true
      selector:
        text: null
    revision:
      name: Revision
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
cancel_workout:
  name: Clear workout
  description: Clears an active draft or saved receipt. This does not delete workouts
    from Hevy. Confirm before clearing a draft.
  fields:
    config_entry_id:
      name: Hevy account
      required: true
      selector:
        config_entry:
          integration: hevy
    session_id:
      name: Session ID
      required: true
      selector:
        text: null
    revision:
      name: Revision
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
resolve_workout:
  name: Resolve workout submission
  description: Use only after checking Hevy. Choose retry only when the workout is
    absent, or discard to clear the local draft. This does not delete a workout from
    Hevy.
  fields:
    config_entry_id:
      name: Hevy account
      required: true
      selector:
        config_entry:
          integration: hevy
    session_id:
      name: Session ID
      required: true
      selector:
        text: null
    revision:
      name: Revision
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    resolution:
      name: Resolution
      required: true
      selector:
        select:
          options:
          - retry
          - discard
